<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เช็คสถานะเอกสารเสนอยา | รพ.เจริญกรุงประชารักษ์</title>
  <script>
    (function () { try { var t = localStorage.getItem("dis-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {} })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../record/css/app.css?v=2">
  <link rel="stylesheet" href="css/ptc.css?v=6">
</head>
<body>
<header class="site-header">
  <div class="nav-pill">
    <div class="brand"><span class="logo-badge">PTC</span><span>ยื่นเสนอยาเข้าบัญชียาโรงพยาบาล<span class="brand-sub">งานบริการเภสัชสนเทศ รพ.เจริญกรุงประชารักษ์</span></span></div>
    <nav class="tabs"><a class="tab" href="submit.html">ยื่นเอกสารใหม่</a></nav>
  </div>
</header>
<main class="wrap" style="max-width:680px;margin-top:24px">
  <div class="view-head"><div><div class="eyebrow">ติดตามเอกสาร</div><h1>เช็คสถานะแฟ้มเสนอยา</h1>
    <p class="sub">ใส่เลขรับ และเลขท้าย 4 ตัวของเบอร์โทรที่ลงทะเบียนไว้</p></div></div>
  <form class="card form-sec" id="tf">
    <div class="row">
      <div class="field"><label for="c">เลขรับ</label><input type="text" id="c" placeholder="P70-001" autocapitalize="characters"></div>
      <div class="field"><label for="l4">เลขท้ายเบอร์โทร 4 ตัว</label><input type="text" id="l4" maxlength="4" inputmode="numeric" pattern="[0-9]*"></div>
    </div>
    <div class="err" id="err" hidden></div>
    <button class="btn btn-primary" type="submit" style="justify-content:center">ดูสถานะ</button>
  </form>
  <div class="card" id="res" hidden style="margin-top:16px"></div>
</main>
<footer><div class="wrap">งานบริการเภสัชสนเทศ กลุ่มงานเภสัชกรรม โรงพยาบาลเจริญกรุงประชารักษ์ · dis.ckph@gmail.com</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../record/js/config.js?v=1"></script>
<script src="js/ptc-forms.js?v=5"></script>
<script src="js/ptc-common.js?v=5"></script>
<script>
(function () {
  var P = window.PTC, sb = P.client(), esc = P.esc;
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search); if (q.get("c")) $("c").value = q.get("c");
  function when(d) { d = new Date(d); return P.thDateLong(d) + " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + " น."; }
  $("tf").addEventListener("submit", async function (e) {
    e.preventDefault(); $("err").hidden = true; $("res").hidden = true;
    var r = await sb.rpc("ptc_status", { c: $("c").value, last4: $("l4").value });
    if (r.error || !r.data) { $("err").textContent = "ไม่พบเอกสาร ตรวจเลขรับและเลขท้ายเบอร์โทรอีกครั้ง"; $("err").hidden = false; return; }
    var d = r.data, ev = d.events || [], firstAt = {};
    ev.forEach(function (x) { var k = x.kind === "status" ? x.status : x.kind; if (!firstAt[k]) firstAt[k] = x.at; firstAt[k + "_last"] = x.at; });
    var cur = d.status, idx = P.FLOW.indexOf(cur === "fix" ? "received" : cur === "out" ? "passed" : cur);
    var steps = [
      ["submitted", "ยื่นออนไลน์ ได้เลขรับ", "พิมพ์ใบ 1.1 และ 1.2 ให้แพทย์ลงนาม แล้วจัดแฟ้มตามแนวทาง"],
      ["received", "งานเภสัชสนเทศรับแฟ้มต้นฉบับแล้ว", "เภสัชกรกำลังตรวจความครบถ้วนตามเช็คลิสต์"],
      ["passed", "ตรวจผ่าน เภสัชกรลงนามใบ 1.2", "มารับแฟ้มไปทำสำเนา แล้วส่งสำเนาและไฟล์ PDF ทางอีเมล dis.ckph@gmail.com"],
      ["complete", "เอกสารครบ รอเข้าที่ประชุม PTC", ""],
      ["ptc", "เข้าวาระประชุม PTC", "แจ้งผลการพิจารณาตามหนังสือของโรงพยาบาล"]
    ];
    var html = '<div class="detail-head"><div><div class="eyebrow">' + esc(d.code) + " · " + (d.kind === "replace" ? "เสนอทดแทน" : "เสนอเข้าใหม่") + " · " + esc(d.dept) +
      '</div><h2 style="margin:4px 0 0">' + esc(d.trade || "") + "</h2></div>" + P.pill(cur) + "</div>";
    if (cur === "failed" || cur === "withdrawn") {
      html += '<div class="note-box">' + esc(d.status_note || P.STATUS[cur][0]) + "</div>";
    } else {
      html += '<ol class="steps">' + steps.map(function (s, i) {
        var cls = i < idx || (i === idx && cur === "ptc") ? "done" : i === idx ? "now" : "";
        var extra = "";
        if (i === 1 && cur === "fix") { cls = "bad"; extra = '<div class="note-box"><b>รอแก้ไขเอกสาร</b>' + (d.status_note ? "\n" + esc(d.status_note) : "") + "</div>"; }
        if (i === 2 && cur === "out") extra = '<div class="note-box">แฟ้มอยู่กับผู้แทน (ยืมไปเมื่อ ' + esc(when(firstAt.borrow_last)) + ") กรุณาส่งคืนพร้อมสำเนา</div>";
        if (i === idx && d.status_note && cur !== "fix") extra += '<div class="note-box">' + esc(d.status_note) + "</div>";
        var at = firstAt[s[0]] ? "<small>" + esc(when(firstAt[s[0]])) + "</small>" : "";
        return '<li class="' + cls + '"><span class="dot">' + (cls === "done" ? "✓" : cls === "bad" ? "!" : i + 1) + "</span><div><b>" + esc(s[1]) + "</b>" + at +
          (cls === "now" || cls === "bad" ? "<small>" + esc(s[2]) + "</small>" : "") + extra + "</div></li>";
      }).join("") + "</ol>";
    }
    $("res").innerHTML = html; $("res").hidden = false;
  });
  if ($("c").value) $("l4").focus();
})();
</script>
</body>
</html>
